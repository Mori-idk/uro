<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wszystkiego Najlepszego!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Poppins:wght@300;400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple-light: #d8b4fe;
            --purple-main: #a855f7;
            --purple-dark: #6b21a8;
            --purple-neon: #c026d3;
            --term-green: #10b981;
            --term-red: #ff5555;
            --bg-color: #080010;
        }

        body { margin: 0; overflow: hidden; background-color: var(--bg-color); font-family: 'Poppins', sans-serif; color: white; user-select: none; transition: background-color 1s ease; height: 100vh; width: 100vw; }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; transition: opacity 2s ease-in; }

        #terminal-screen { position: absolute; inset: 0; background-color: #05000a; z-index: 100; display: flex; flex-direction: column; padding: clamp(1rem, 5vw, 3rem); font-family: 'Fira Code', monospace; transition: opacity 1s ease-in-out; overflow-y: auto; scroll-behavior: smooth; }

        .terminal-line { color: var(--term-green); font-size: clamp(0.9rem, 2.5vw, 1.1rem); margin-bottom: 0.5rem; text-shadow: 0 0 5px var(--term-green); word-break: break-word; line-height: 1.4; }
        .term-red { color: var(--term-red); text-shadow: 0 0 8px var(--term-red); font-weight: bold; }
        .term-sys { color: var(--purple-light); text-shadow: 0 0 5px var(--purple-main); }
        .term-pink { color: #f472b6; text-shadow: 0 0 5px #f472b6; font-weight: bold; }
        
        .typing-cursor::after { content: '█'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .input-wrapper { display: none; align-items: center; width: 100%; margin-top: 0.5rem; padding-bottom: 2rem; }
        .prompt { color: var(--purple-neon); text-shadow: 0 0 5px var(--purple-neon); margin-right: 0.8rem; white-space: nowrap; font-size: clamp(0.9rem, 2.5vw, 1.1rem); }
        #cmd-input { background: transparent; border: none; color: white; font-family: 'Fira Code', monospace; font-size: clamp(0.9rem, 2.5vw, 1.1rem); outline: none; flex-grow: 1; text-shadow: 0 0 5px white; width: 100%; }

        #card-screen { position: absolute; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; padding: 1rem; }
        .glass-card { background: rgba(25, 10, 35, 0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 40px rgba(168, 85, 247, 0.3), inset 0 0 20px rgba(168, 85, 247, 0.1); border-radius: 24px; padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3rem); width: 100%; max-width: 850px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2rem; transform: translateY(20px); transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #card-screen.visible .glass-card { transform: translateY(0); }

        .glitch-title { font-family: 'Press Start 2P', cursive; font-size: clamp(1.2rem, 4vw, 2.2rem); color: #fff; text-shadow: 0 0 10px var(--purple-neon), 0 0 20px var(--purple-neon); line-height: 1.6; position: relative; display: inline-block; }
        .glitch-title:hover { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }
        @keyframes glitch-skew { 0% { transform: skew(0deg); } 20% { transform: skew(-10deg); text-shadow: -2px 0 #0ff, 2px 0 #f0f; } 40% { transform: skew(10deg); text-shadow: 2px 0 #0ff, -2px 0 #f0f; } 60% { transform: skew(-5deg); text-shadow: -1px 0 #0ff, 1px 0 #f0f; } 80% { transform: skew(5deg); text-shadow: 1px 0 #0ff, -1px 0 #f0f; } 100% { transform: skew(0deg); } }

        .body-text { font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.8; color: #e2e8f0; font-weight: 300; max-width: 90%; }
        .kaomoji { font-size: clamp(1.5rem, 4vw, 2rem); color: var(--purple-light); text-shadow: 0 0 10px var(--purple-neon); cursor: pointer; transition: all 0.3s ease; user-select: auto; }
        .kaomoji:hover { color: #fff; transform: scale(1.1); }

        .buttons-row { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .kpop-btn { background: rgba(10, 5, 20, 0.7); border: 2px solid var(--purple-main); border-radius: 9999px; padding: clamp(10px, 3vw, 15px) clamp(20px, 5vw, 35px); display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transition: all 0.3s ease; cursor: pointer; color: white; font-weight: 500; font-size: clamp(0.85rem, 2vw, 1rem); }
        .kpop-btn:hover { box-shadow: 0 0 25px var(--purple-neon); background: rgba(168, 85, 247, 0.25); transform: scale(1.05); }

        .mini-terminal { background: rgba(5, 0, 10, 0.8); border: 1px solid var(--purple-main); border-radius: 8px; padding: 10px 15px; display: flex; align-items: center; width: 100%; max-width: 400px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(168, 85, 247, 0.3); margin-top: 10px; }
        #mini-cmd-input { background: transparent; border: none; color: var(--term-green); font-family: 'Fira Code', monospace; font-size: clamp(0.8rem, 2vw, 1rem); outline: none; flex-grow: 1; width: 100%; }
        #mini-cmd-input::placeholder { color: rgba(16, 185, 129, 0.4); }

        #custom-modal, #game-modal, #cake-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 1rem; }
        #custom-modal.active, #game-modal.active, #cake-modal.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: rgba(20, 5, 30, 0.95); border: 2px solid var(--purple-neon); box-shadow: 0 0 30px var(--purple-neon); padding: 2.5rem 2rem; border-radius: 16px; max-width: 550px; width: 100%; text-align: center; transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
        #custom-modal.active .modal-box, #game-modal.active .modal-box, #cake-modal.active .modal-box { transform: scale(1); }
        .modal-text { font-family: 'Press Start 2P', cursive; font-size: clamp(0.7rem, 2vw, 0.9rem); color: #fff; line-height: 1.6; }
        .modal-btn { background: var(--purple-main); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-family: 'Poppins', sans-serif; font-weight: bold; cursor: pointer; transition: all 0.2s; align-self: center; }
        .modal-btn:hover { background: var(--purple-neon); box-shadow: 0 0 15px var(--purple-neon); }

        /* Memory Game */
        .memory-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(5px, 2vw, 15px); margin: 10px auto; width: 100%; max-width: 400px; perspective: 1000px; }
        .memory-card { aspect-ratio: 1 / 1; background: transparent; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .memory-card.flipped { transform: rotateY(180deg); }
        .memory-card-front, .memory-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; border-radius: 12px; font-size: clamp(1.5rem, 5vw, 2.5rem); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .memory-card-back { background: rgba(168, 85, 247, 0.2); border: 2px solid var(--purple-main); color: var(--purple-light); }
        .memory-card-front { background: rgba(168, 85, 247, 0.8); border: 2px solid var(--purple-neon); transform: rotateY(180deg); }
        .memory-card.matched .memory-card-front { background: rgba(16, 185, 129, 0.5); border-color: var(--term-green); }

        /* Cake & Candles */
        .cake-container { position: relative; width: 200px; height: 150px; margin: 40px auto 20px; }
        .cake-layer { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 10px; }
        .layer-bottom { bottom: 0; width: 200px; height: 50px; background: #c026d3; box-shadow: inset 0 -10px rgba(0,0,0,0.2); }
        .layer-middle { bottom: 50px; width: 160px; height: 45px; background: #a855f7; box-shadow: inset 0 -10px rgba(0,0,0,0.2); }
        .layer-top { bottom: 95px; width: 120px; height: 40px; background: #d8b4fe; box-shadow: inset 0 -10px rgba(0,0,0,0.2); }
        .candle { position: absolute; bottom: 135px; width: 12px; height: 35px; background: #fff; border-radius: 6px; box-shadow: inset -3px 0 rgba(0,0,0,0.1); cursor: pointer; }
        .candle-1 { left: 50px; } .candle-2 { left: 94px; } .candle-3 { left: 138px; }
        .flame { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 14px; height: 22px; background: #fbbf24; border-radius: 50% 50% 20% 20%; box-shadow: 0 0 15px #fbbf24, 0 0 25px #f59e0b; animation: flicker 0.1s infinite alternate; transition: all 0.3s; }
        .flame.blown-out { opacity: 0; transform: translateX(-50%) scale(0); }
        @keyframes flicker { 0% { transform: translateX(-50%) scale(1); opacity: 1; } 100% { transform: translateX(-50%) scale(1.1); opacity: 0.9; } }
        
        .balloon { position: absolute; width: 30px; height: 40px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; opacity: 0.7; animation: floatUp 6s infinite ease-in-out; }
        .balloon::after { content: ''; position: absolute; bottom: -10px; left: 14px; width: 2px; height: 20px; background: rgba(255,255,255,0.5); }
        .b1 { left: -40px; bottom: 20px; background: #ec4899; animation-delay: 0s; }
        .b2 { left: 210px; bottom: 60px; background: #10b981; animation-delay: 1.5s; }
        .b3 { left: -70px; bottom: 80px; background: #a855f7; animation-delay: 3s; }
        .b4 { left: 240px; bottom: 10px; background: #3b82f6; animation-delay: 4.5s; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-30px) rotate(5deg); } 100% { transform: translateY(0) rotate(-5deg); } }

        pre.ascii-art { font-family: 'Fira Code', monospace; line-height: 1.2; white-space: pre-wrap; margin: 10px 0; font-size: clamp(0.8rem, 2vw, 1.1rem); }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); } ::-webkit-scrollbar-thumb { background: var(--purple-main); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div id="terminal-screen" onclick="document.getElementById('cmd-input').focus()">
        <div id="term-output"></div>
        <div class="input-wrapper" id="input-wrapper">
            <span class="prompt">root@bro:~$</span>
            <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    
    <div id="card-screen">
        <div class="glass-card">
            <div class="glitch-title">Wszystkiego<br>najlepszego bro!</div>
            <p class="body-text">Spełnienia życzeń, dużo mamony i szczęścia życzę ci ja 😚<br><br>Wiesz że cię kocham prawda?? You are my Darling Sister ❤️</p>
            <div class="kaomoji" id="easter-egg-btn" title="Kliknij mnie!">(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</div>
            
            <div class="buttons-row">
                <button id="mini-game-btn" class="kpop-btn"><span>🎮</span><span>Mini-Gra</span></button>
                <button id="cake-btn" class="kpop-btn"><span>🎂</span><span>Zdmuchnij świeczki!</span></button>
            </div>

            <div class="mini-terminal">
                <span class="prompt">root@bro:~$</span>
                <input type="text" id="mini-cmd-input" autocomplete="off" spellcheck="false" placeholder="Wpisz 'exit' aby wrócić...">
            </div>
        </div>
    </div>

    <div id="custom-modal"><div class="modal-box"><div class="modal-text" id="modal-content-text">...</div><button class="modal-btn" onclick="closeModal()">Rozumiem</button></div></div>
    
    <div id="game-modal"><div class="modal-box"><div class="glitch-title" style="font-size: clamp(1rem, 3vw, 1.5rem); margin-bottom: 0;">Memory</div><div id="game-board" class="memory-board"></div><div id="game-message" class="modal-text" style="display:none; color: var(--term-green); font-size: 1.1rem; margin-top:10px;">Wygrałaś! Moc jest z tobą! 🎉</div><button class="modal-btn" onclick="closeGameModal()" style="margin-top: 10px;">Zamknij</button></div></div>
    
    <div id="cake-modal">
        <div class="modal-box" style="padding-top: 40px; padding-bottom: 40px;">
            <div class="glitch-title" style="font-size: clamp(1rem, 3vw, 1.5rem); margin-bottom: 10px;">Pomyśl życzenie!</div>
            <div style="color: var(--term-green); font-size: 0.9rem; margin-bottom: 20px;">Kliknij płomienie</div>
            <div class="cake-container">
                <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div><div class="balloon b4"></div>
                <div class="cake-layer layer-bottom"></div>
                <div class="cake-layer layer-middle"></div>
                <div class="cake-layer layer-top"></div>
                <div class="candle candle-1" onclick="extinguish(this)"><div class="flame"></div></div>
                <div class="candle candle-2" onclick="extinguish(this)"><div class="flame"></div></div>
                <div class="candle candle-3" onclick="extinguish(this)"><div class="flame"></div></div>
            </div>
            <button class="modal-btn" onclick="closeCakeModal()" style="margin-top: 30px;">Zamknij</button>
        </div>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrix-canvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        let isKawaiiMode = false; let chars = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜBTSEXONCTITZYTWICE{}<>;/101010'.split(''); let fontSize = 16; let drops = [];
        function initMatrix() { let columns = canvas.width / fontSize; drops = []; for (let x = 0; x < columns; x++) { drops[x] = 1; } }
        initMatrix(); window.addEventListener('resize', initMatrix);
        function drawMatrix() {
            ctx.fillStyle = isKawaiiMode ? 'rgba(26, 11, 23, 0.05)' : 'rgba(8, 0, 16, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                if (!isKawaiiMode) { const r = Math.random(); if(r > 0.95) ctx.fillStyle = '#fff'; else if(r > 0.7) ctx.fillStyle = '#d8b4fe'; else ctx.fillStyle = '#a855f7'; } 
                else { const r = Math.random(); if(r > 0.95) ctx.fillStyle = '#fff'; else if(r > 0.7) ctx.fillStyle = '#fbcfe8'; else ctx.fillStyle = '#ec4899'; }
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Terminal Logic
        const termOutput = document.getElementById('term-output'); const inputWrapper = document.getElementById('input-wrapper'); const cmdInput = document.getElementById('cmd-input');
        const bootSequence = ["Booting Urodziny-OS v3.1...", "Inicjalizacja modułów ... [OK]", "Ładowanie sekwencji ... [OK]", "System gotowy do działania."];
        const funnyErrors = ["Nieznane polecenie. Wpisz to poprawnie, hackerze!", "To nie Windows, spróbuj innej magii.", "Błąd: Twój kot zasnął na klawiaturze?", "Błąd 404: Komenda wyparowała."];
        const restrictedCommands = ['cd', 'sudo', 'rm', 'mkdir', 'pwd', 'cp', 'mv', 'apt', 'npm', 'git'];

        function createTermLine(text, customClass = "") { const el = document.createElement('div'); el.className = `terminal-line ${customClass}`; el.innerHTML = text; return el; }
        async function typeLine(text, delay = 50) {
            const line = createTermLine("", "term-sys typing-cursor"); termOutput.appendChild(line);
            for(let i=0; i<text.length; i++) { line.textContent += text[i]; await new Promise(r => setTimeout(r, delay + (Math.random() * 30))); }
            line.classList.remove('typing-cursor'); autoScroll();
        }
        async function runBootSequence() { for(let i=0; i<bootSequence.length; i++) { await typeLine(bootSequence[i], 30); await new Promise(r => setTimeout(r, 400)); } inputWrapper.style.display = 'flex'; cmdInput.focus(); }
        window.onload = () => setTimeout(runBootSequence, 500);
        function autoScroll() { const termScreen = document.getElementById('terminal-screen'); termScreen.scrollTop = termScreen.scrollHeight; }

        cmdInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const val = this.value.trim(); const lowerVal = val.toLowerCase(); const cmdBase = lowerVal.split(' ')[0];
                termOutput.appendChild(createTermLine(`<span style="color:var(--purple-neon)">root@bro:~$</span> ${val}`)); this.value = '';
                if (val === '') {}
                else if (restrictedCommands.includes(cmdBase)) { termOutput.appendChild(createTermLine(`<span style="color: var(--term-red)">bash: ${cmdBase}: Odmowa dostępu. Brak wystarczających uprawnień. Zgłoszono incydent do administratora!</span>`)); }
                else if (lowerVal === 'ls') { termOutput.appendChild(createTermLine("prezent.sh  readme.txt  tajne_dane.txt  skaner.sh", "term-sys")); } 
                else if (lowerVal === 'ls -a' || lowerVal === 'ls -al' || lowerVal === 'ls -la') { termOutput.appendChild(createTermLine(".  ..  .flower  prezent.sh  readme.txt  tajne_dane.txt  skaner.sh", "term-sys")); }
                else if (lowerVal === 'cat readme.txt') { termOutput.appendChild(createTermLine("Wpisz 'get' aby wygenerować kartę statystyk z tego roku. W systemie ukryty jest też prezent (prezent.sh).", "term-sys")); }
                else if (lowerVal === 'cat tajne_dane.txt') {
                    const extraWishes = `<div style="text-align: center; margin: 20px 0; width: 100%;">
                        <div style="color: var(--term-green); margin-bottom: 15px; font-size: 1.1rem;">Dużo zdrówka, mało stresu, darmowej pizzy i żeby życie było zajebiste.</div>
                        <img src="ok.jpg" alt="bro" style="max-width: 90%; max-height: 400px; border-radius: 15px; border: 3px solid var(--purple-neon); box-shadow: 0 0 30px rgba(192, 38, 211, 0.6); display: inline-block; object-fit: cover;" onload="document.getElementById('terminal-screen').scrollTop = document.getElementById('terminal-screen').scrollHeight;">
                        <div style="color: var(--term-pink); font-family: 'Poppins', sans-serif; font-weight: bold; margin-top: 15px; font-size: 1.1rem; text-shadow: 0 0 8px var(--term-pink);">Tak, to Ty 🐈. Hakerkman level hard! 😎✨</div>
                    </div>`;
                    termOutput.appendChild(createTermLine(extraWishes));
                }
                else if (lowerVal === 'cat .flower' || lowerVal === 'cat flower') { termOutput.appendChild(createTermLine(`<pre class="ascii-art term-pink">\n   {\\__/}\n   ( • . •)\n   / > 🌸 Proszę, to dla Ciebie!\n</pre>`, "term-pink")); }
                else if (lowerVal === './skaner.sh' || lowerVal === 'bash skaner.sh') {
                    inputWrapper.style.display = 'none';
                    await typeLine("Uruchamianie Skanera Osobowości v2.0...", 30); await new Promise(r => setTimeout(r, 500));
                    termOutput.appendChild(createTermLine("Skanowanie poziomu umiejętności IT... [██████████] 100% - Wynik: Senior Dev od urodzenia", "term-green")); autoScroll(); await new Promise(r => setTimeout(r, 800));
                    termOutput.appendChild(createTermLine("Skanowanie uzależnienia od Anime... [██████████] OVER 9000% - Wynik: Otaku Level MAX", "term-pink")); autoScroll(); await new Promise(r => setTimeout(r, 800));
                    termOutput.appendChild(createTermLine("Skanowanie playlisty [██████████] 100% - Wynik: Ultimate Fan 🎶", "term-sys")); autoScroll(); await new Promise(r => setTimeout(r, 800));
                    await typeLine("Wniosek końcowy: JESTEŚ SIGIEMKĄ 😎✨", 40);
                    inputWrapper.style.display = 'flex'; cmdInput.focus();
                }
                else if (lowerVal === 'get') {
                    termOutput.appendChild(createTermLine("Generowanie Systemowego Raportu 2026... ⏳", "term-sys"));
                    autoScroll();
            
                    const cvs = document.createElement('canvas'); cvs.width = 1080; cvs.height = 1920; const ctx = cvs.getContext('2d');
            
                    // Tło minimalistyczne, bardzo ciemne
                    const grad = ctx.createLinearGradient(0, 0, 0, 1920);
                    grad.addColorStop(0, '#06020a');
                    grad.addColorStop(1, '#11051c');
                    ctx.fillStyle = grad; 
                    ctx.fillRect(0, 0, 1080, 1920);
            
                    // Subtelna, technologiczna siatka w tle (grid)
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                    ctx.lineWidth = 1;
                    for(let i = 0; i < 1080; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1920); ctx.stroke(); }
                    for(let i = 0; i < 1920; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1080, i); ctx.stroke(); }
            
                    // Minimalistyczny, nowoczesny nagłówek
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 95px Poppins, sans-serif'; 
                    ctx.fillText('LEVEL UP!', 540, 180);
                    
                    ctx.fillStyle = '#10b981'; // hakerski zielony
                    ctx.font = '600 35px Fira Code, monospace'; 
                    ctx.fillText('> SYSTEM_UPDATE_COMPLETE', 540, 280);
            
                    const img = new Image(); 
                    img.src = 'ok.jpg';
                    img.onload = () => {
                        const cx = 540; const cy = 700; const radius = 300;
            
                        // Geometryczny tech-ring wokół zdjęcia
                        ctx.save();
                        ctx.beginPath(); ctx.arc(cx, cy, radius + 25, 0, Math.PI * 2);
                        ctx.strokeStyle = '#a855f7';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([15, 20]);
                        ctx.stroke();
                        ctx.restore();
            
                        // Ramka dla zdjęcia
                        ctx.save(); 
                        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2, true); ctx.closePath();
                        ctx.lineWidth = 6; 
                        ctx.strokeStyle = '#ffffff'; 
                        ctx.stroke(); 
                        
                        ctx.clip(); 
            
                        // Rysowanie z object-fit cover
                        const imgRatio = img.width / img.height;
                        let drawWidth = radius * 2;
                        let drawHeight = radius * 2;
                        let drawX = cx - radius;
                        let drawY = cy - radius;
            
                        if (imgRatio > 1) { 
                            drawWidth = drawHeight * imgRatio;
                            drawX = cx - (drawWidth / 2);
                        } else { 
                            drawHeight = drawWidth / imgRatio;
                            drawY = cy - (drawHeight / 2);
                        }
            
                        ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight); 
                        ctx.restore();
            
                        // Sekcja minimalistycznych statystyk (clean lines)
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#d8b4fe'; 
                        ctx.font = '700 45px Poppins, sans-serif'; 
                        ctx.fillText('USER_STATS:', 150, 1140);
            
                        const stats = [
                            { icon: '🐛', text: 'Bugi naprawione', val: 'OVER 9000' },
                            { icon: '🌸', text: 'Obejrzane Anime', val: 'NIEZLICZONE' },
                            { icon: '🎧', text: 'K-Pop Playtime', val: '999k MIN' },
                            { icon: '🚀', text: 'Zajebistość', val: 'INFINITY' }
                        ];
            
                        let startY = 1240;
                        stats.forEach((stat) => {
                            // Cienka biała linia oddzielająca
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                            ctx.fillRect(150, startY, 780, 2);
                            
                            // Ikona i tekst (po lewej)
                            ctx.fillStyle = '#ffffff';
                            ctx.font = '400 40px Poppins, sans-serif';
                            ctx.fillText(`${stat.icon}  ${stat.text}`, 150, startY + 50);
                            
                            // Wartość (po prawej, czcionka z kodowania)
                            ctx.textAlign = 'right';
                            ctx.fillStyle = '#10b981';
                            ctx.font = '600 40px Fira Code, monospace';
                            ctx.fillText(stat.val, 930, startY + 50);
                            ctx.textAlign = 'left';
            
                            startY += 110;
                        });
            
                        // Minimalistyczny dolny napis
                        ctx.textAlign = 'center'; 
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; 
                        ctx.font = '300 35px Poppins, sans-serif'; 
                        ctx.fillText('STATUS: W 1% NAJLEPSZYCH SIÓSTR NA ŚWIECIE ❤️', 540, 1800);
            
                        try {
                            const link = document.createElement('a'); link.download = 'Urodzinowe_Stats_2026.png'; link.href = cvs.toDataURL('image/png'); link.click();
                            termOutput.appendChild(createTermLine("Sukces! Pomyślnie pobrano plik Urodzinowe_Stats_2026.png 🎁", "term-green")); 
                        } catch (error) {
                            termOutput.appendChild(createTermLine("Błąd pobierania (blokada przeglądarki). Uruchom przez Live Server!", "term-red"));
                        }
                        autoScroll();
                    };
                    img.onerror = () => {
                        termOutput.appendChild(createTermLine("Błąd pobierania zdjęcia. Upewnij się, że plik ok.jpg jest w tym samym folderze co kod!", "term-red")); autoScroll();
                    };
                }
                else if (lowerVal === './prezent.sh' || lowerVal === 'bash prezent.sh') { inputWrapper.style.display = 'none'; await triggerFakeWipe(); } 
                else { termOutput.appendChild(createTermLine(funnyErrors[Math.floor(Math.random() * funnyErrors.length)], "term-red")); }
                setTimeout(autoScroll, 50);
            }
        });

        async function triggerFakeWipe() {
            termOutput.innerHTML = '';
            const wipeLines = ["CRITICAL WARNING: SCRIPT EXECUTION...", "WIPING DATABASE... 10%", "DELETING ANIME WATCH HISTORY... 45%", "REMOVING ALL SAVED CODE... 89%", "SYSTEM WIPE COMPLETE... 100%"];
            for (let line of wipeLines) { termOutput.appendChild(createTermLine(line, "term-red")); autoScroll(); await new Promise(r => setTimeout(r, 300 + Math.random() * 200)); }
            await new Promise(r => setTimeout(r, 1200));
            const termScreen = document.getElementById('terminal-screen'); const cardScreen = document.getElementById('card-screen'); const matrixCanvas = document.getElementById('matrix-canvas');
            termScreen.style.opacity = '0';
            setTimeout(() => { termScreen.style.display = 'none'; matrixCanvas.style.opacity = '0.75'; cardScreen.style.opacity = '1'; cardScreen.style.pointerEvents = 'auto'; cardScreen.classList.add('visible'); }, 1000);
        }

        // Return from Card to Terminal
        document.getElementById('mini-cmd-input').addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') { if (this.value.trim().toLowerCase() === 'exit') { this.value = ''; await triggerReverseWipe(); } else { this.value = ''; } }
        });
        async function triggerReverseWipe() {
            const termScreen = document.getElementById('terminal-screen'); const cardScreen = document.getElementById('card-screen');
            cardScreen.style.animation = 'glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite';
            await new Promise(r => setTimeout(r, 600)); cardScreen.style.animation = ''; cardScreen.classList.remove('visible'); cardScreen.style.opacity = '0'; cardScreen.style.pointerEvents = 'none';
            await new Promise(r => setTimeout(r, 800));
            termScreen.style.display = 'flex'; setTimeout(() => { termScreen.style.opacity = '1'; }, 50); termOutput.innerHTML = '';
            const restoreLines = ["INITIATING SYSTEM RESTORE...", "RECOVERING DATABASE... [OK]", "RESTORING ANIME WATCH HISTORY... [OK]", "SYSTEM RESTORE COMPLETE.", "Witaj ponownie, Hackerze."];
            for (let line of restoreLines) { termOutput.appendChild(createTermLine(line, "term-sys")); autoScroll(); await new Promise(r => setTimeout(r, 200 + Math.random() * 150)); }
            inputWrapper.style.display = 'flex'; cmdInput.focus();
        }

        // Easter Eggs
        const modal = document.getElementById('custom-modal'); const modalText = document.getElementById('modal-content-text');
        function showModal(text, color = "var(--term-red)") { modalText.innerText = text; modalText.style.color = color; modal.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); }
        document.getElementById('easter-egg-btn').addEventListener('click', () => { showModal("System Error:\nPoziom zajebistości przekroczył limit!", "var(--term-red)"); });

        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']; let konamiIndex = 0;
        window.addEventListener('keydown', (e) => { if (e.key === konamiCode[konamiIndex]) { konamiIndex++; if (konamiIndex === konamiCode.length) { activateKawaiiMode(); konamiIndex = 0; } } else { konamiIndex = 0; } });
        function activateKawaiiMode() {
            if (isKawaiiMode) return; isKawaiiMode = true; chars = '🌸✨💖🎤🎶🎀(✿◠‿◠)UwU'.split(''); fontSize = 22; 
            document.documentElement.style.setProperty('--purple-light', '#fbcfe8'); document.documentElement.style.setProperty('--purple-main', '#ec4899'); document.documentElement.style.setProperty('--purple-neon', '#db2777'); document.documentElement.style.setProperty('--bg-color', '#1a0b17');
            showModal("SUPER KAWAII SAKURA MODE:\nODBLOKOWANY!", "#ec4899");
        }

        // Memory Game
        const emojis = ['🦋', '💻', '🌸', '🎧', '💜', '🍣']; let gameCards = [...emojis, ...emojis];
        let hasFlippedCard = false; let lockBoard = false; let firstCard, secondCard; let matchedCount = 0;
        function initGame() {
            const board = document.getElementById('game-board'); board.innerHTML = ''; document.getElementById('game-message').style.display = 'none';
            matchedCount = 0; hasFlippedCard = false; lockBoard = false; firstCard = null; secondCard = null; gameCards.sort(() => 0.5 - Math.random());
            gameCards.forEach((emoji) => {
                const card = document.createElement('div'); card.classList.add('memory-card'); card.dataset.emoji = emoji;
                const front = document.createElement('div'); front.classList.add('memory-card-front'); front.innerText = emoji;
                const back = document.createElement('div'); back.classList.add('memory-card-back'); back.innerText = '❓';
                card.appendChild(front); card.appendChild(back); card.addEventListener('click', flipCard); board.appendChild(card);
            });
        }
        function flipCard() { if (lockBoard) return; if (this === firstCard) return; this.classList.add('flipped'); if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; } secondCard = this; checkForMatch(); }
        function checkForMatch() { let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji; isMatch ? disableCards() : unflipCards(); }
        function disableCards() {
            firstCard.removeEventListener('click', flipCard); secondCard.removeEventListener('click', flipCard);
            firstCard.classList.add('matched'); secondCard.classList.add('matched'); matchedCount += 2;
            if (matchedCount === gameCards.length) { setTimeout(() => { document.getElementById('game-message').style.display = 'block'; }, 500); } resetBoard();
        }
        function unflipCards() { lockBoard = true; setTimeout(() => { firstCard.classList.remove('flipped'); secondCard.classList.remove('flipped'); resetBoard(); }, 1000); }
        function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }
        document.getElementById('mini-game-btn').addEventListener('click', () => { initGame(); document.getElementById('game-modal').classList.add('active'); });
        function closeGameModal() { document.getElementById('game-modal').classList.remove('active'); }

        // Cake & Candles Logic
        let blownCandles = 0; let micStream = null; let audioContext = null;
        document.getElementById('cake-btn').addEventListener('click', () => { 
            document.getElementById('cake-modal').classList.add('active'); 
            resetCandles(); startMicListener(); 
        });
        function closeCakeModal() { document.getElementById('cake-modal').classList.remove('active'); stopMicListener(); }
        
        function extinguish(element) {
            const flame = element.querySelector('.flame');
            if (!flame.classList.contains('blown-out')) {
                flame.classList.add('blown-out'); blownCandles++;
                if (blownCandles === 3) setTimeout(() => showModal("Życzenie pomyślane! 🎂", "var(--term-green)"), 500);
            }
        }
        function resetCandles() { blownCandles = 0; document.querySelectorAll('.flame').forEach(f => f.classList.remove('blown-out')); }
        
        async function startMicListener() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(micStream);
                const analyzer = audioContext.createAnalyser();
                analyzer.fftSize = 256; source.connect(analyzer);
                const dataArray = new Uint8Array(analyzer.frequencyBinCount);
                
                function detectBlow() {
                    if (!micStream) return;
                    analyzer.getByteFrequencyData(dataArray);
                    let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;
                    
                    if (average > 80 && blownCandles < 3) {
                        const flames = document.querySelectorAll('.flame:not(.blown-out)');
                        if (flames.length > 0) extinguish(flames[0].parentElement);
                    }
                    requestAnimationFrame(detectBlow);
                }
                detectBlow();
            } catch (err) { console.log("Mikrofon niedostępny, ale można klikać świeczki!"); }
        }
        function stopMicListener() {
            if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
        }
    </script>
</body>
